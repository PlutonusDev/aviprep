<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f78601" />
  <title>Offline · AviPrep</title>
  <style>
    :root { color-scheme: light dark; --bg:#ffffff; --card:#ffffff; --fg:#1b1f24; --muted:#5f6670; --border:#e3e6ea; --primary:#f78601; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0b0e11; --card:#12161a; --fg:#eef1f4; --muted:#9aa3ad; --border:#262c33; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px; padding-bottom:max(24px, env(safe-area-inset-bottom));
      background:var(--bg); color:var(--fg); font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .card { width:100%; max-width:380px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:32px 24px; text-align:center;
      box-shadow:0 1px 2px rgba(0,0,0,.05); }
    img { height:44px; width:auto; margin-bottom:24px; }
    h1 { font-size:20px; margin:0 0 8px; }
    p { margin:0 0 24px; color:var(--muted); font-size:15px; line-height:1.55; }
    button { appearance:none; border:0; border-radius:8px; background:var(--primary); color:#1b1f24; font:600 15px/1 inherit; height:44px; padding:0 20px; width:100%; cursor:pointer; }
    button:focus-visible { outline:2px solid var(--fg); outline-offset:2px; }
  </style>
</head>
<body>
  <main class="card">
    <img src="/img/AviPrep-logo.png" alt="AviPrep" />
    <h1>You're offline</h1>
    <p>AviPrep needs a connection to load your lessons and exams. Reconnect and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
  <script>window.addEventListener("online", function () { location.reload() })</script>
</body>
</html>
